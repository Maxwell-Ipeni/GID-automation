# fly.toml for Get It Done backend
# Deploy: fly launch --copy-config
# Set secrets: fly secrets set AMAZON_AFFILIATE_TAG=... PINTEREST_ACCESS_TOKEN=... etc.

app = "get-it-done-backend"

primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.backend"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.health_check]
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
